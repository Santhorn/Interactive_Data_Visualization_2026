<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Data Visualization — D3.js</title><link rel="stylesheet" href="style.css"></head><body><header><div><div class="eyebrow">DATA VISUALIZATION TECHNOLOGY</div><h1>สถิติผู้เสียชีวิตจากเหตุที่เกี่ยวข้องกับยานพาหนะ</h1><p>Interactive Dashboard · ข้อมูลปี 2026</p></div><b>D3.js</b></header><main><section class="panel"><h2>ตัวกรองข้อมูล</h2><div class="grid"><label>เดือน<select id="month"><option value="">ทั้งหมด</option></select></label><label>เพศ<select id="sex"><option value="">ทั้งหมด</option></select></label><label>จังหวัด<select id="province"><option value="">ทั้งหมด</option></select></label><label>พาหนะ<select id="vehicle"><option value="">ทั้งหมด</option></select></label><label>วันในสัปดาห์<select id="weekday"><option value="">ทั้งหมด</option></select></label></div><button id="reset">↻ ล้างตัวกรอง</button><span id="status"></span></section><section class="kpis"><div><small>จำนวนรายการ</small><strong id="total">-</strong></div><div><small>อายุเฉลี่ย</small><strong id="age">-</strong></div><div><small>เพศชาย</small><strong id="male">-</strong></div><div><small>จังหวัดที่พบ</small><strong id="provCount">-</strong></div><div><small>พาหนะสูงสุด</small><strong id="topVehicle">-</strong></div></section><section class="cards"><article class="wide"><h2>แนวโน้มรายเดือน</h2><div id="monthly"></div></article><article><h2>สัดส่วนเพศ</h2><div id="sexChart"></div></article><article><h2>ประเภทยานพาหนะ</h2><div id="vehicleChart"></div></article><article class="wide"><h2>จังหวัด Top 15</h2><div id="provinceChart"></div></article><article><h2>วันในสัปดาห์</h2><div id="weekdayChart"></div></article><article><h2>อายุเฉลี่ย</h2><div class="big" id="ageBig">-</div></article></section></main><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="script.js"></script></body></html>
